<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="Fill rate under three queue-position assumptions, on identical market data">
<rect width="700" height="300" fill="#1a1a19"/>
<text x="24" y="32" font-size="15" font-weight="600" fill="#ffffff">The same data gives three different answers</text>
<text x="24" y="52" font-size="12" fill="#c3c2b7">Fill rate for one passive strategy. Only the assumption about where cancellations sat changes.</text>
<rect x="326.1" y="82.0" width="77.8" height="142.0" fill="#3987e5" opacity="0.10"/>
<text x="132" y="101.0" font-size="12.5" fill="#ffffff" text-anchor="end">pessimistic</text>
<line x1="148" y1="96.0" x2="326.1" y2="96.0" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="326.1" cy="96.0" r="8" fill="#1c5cab" stroke="#1a1a19" stroke-width="2"/>
<text x="342.1" y="101.0" font-size="13" font-weight="600" fill="#ffffff">23.1%</text>
<text x="132" y="147.0" font-size="12.5" fill="#ffffff" text-anchor="end">proportional</text>
<line x1="148" y1="142.0" x2="332.9" y2="142.0" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="332.9" cy="142.0" r="8" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="348.9" y="147.0" font-size="13" font-weight="600" fill="#ffffff">23.2%</text>
<text x="132" y="193.0" font-size="12.5" fill="#ffffff" text-anchor="end">optimistic</text>
<line x1="148" y1="188.0" x2="403.9" y2="188.0" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="403.9" cy="188.0" r="8" fill="#86b6ef" stroke="#1a1a19" stroke-width="2"/>
<text x="419.9" y="193.0" font-size="13" font-weight="600" fill="#ffffff">25.0%</text>
<line x1="326.1" y1="240.0" x2="403.9" y2="240.0" stroke="#383835" stroke-width="1.5"/>
<line x1="326.1" y1="235.0" x2="326.1" y2="245.0" stroke="#383835" stroke-width="1.5"/>
<line x1="403.9" y1="235.0" x2="403.9" y2="245.0" stroke="#383835" stroke-width="1.5"/>
<text x="365.0" y="264.0" font-size="12" fill="#c3c2b7" text-anchor="middle">2.0 points the feed cannot resolve</text>
</svg>